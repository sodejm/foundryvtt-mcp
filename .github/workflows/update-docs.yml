name: Update Documentation

on:
  # Trigger on pushes to main branch
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'README.md'
      - 'typedoc.json'
      - 'package.json'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-docs:
    if: github.repository == 'laurigates/foundryvtt-mcp'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use a personal access token to allow pushing back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate documentation
        run: |
          # Generate TypeDoc documentation with error checking disabled for problematic files
          bunx typedoc src/foundry/client.ts src/foundry/types.ts src/config/index.ts src/utils/logger.ts \
            --out docs \
            --name "FoundryVTT MCP Server Documentation" \
            --readme README.md \
            --skipErrorChecking \
            --cleanOutputDir

      - name: Check for documentation changes
        id: docs-changes
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push documentation updates
        if: steps.docs-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git commit -m "📚 Update documentation

          Auto-generated by GitHub Action

          🤖 Generated with [Claude Code](https://claude.ai/code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push

      - name: Create documentation summary
        if: steps.docs-changes.outputs.changed == 'true'
        run: |
          {
            echo "## 📚 Documentation Updated"
            echo ""
            echo "The TypeDoc documentation has been regenerated and committed to the repository."
            echo ""
            echo "### 📁 Generated Files:"
            echo "- API documentation for FoundryClient class"
            echo "- TypeScript interface documentation"
            echo "- Configuration and utility documentation"
            echo "- Usage examples and code samples"
            echo ""
            echo "View the documentation by browsing the \`docs/\` folder in the repository."
          } >> "$GITHUB_STEP_SUMMARY"
