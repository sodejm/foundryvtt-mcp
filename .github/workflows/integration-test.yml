name: Integration Tests

# Live tests require an externally reachable, licensed, launched disposable
# test1world with dnd5e, the REST relay and all fixture controllers prepared.
# Credentials for downloading Foundry alone do not create or launch that world.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check prepared FoundryVTT endpoint
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          FOUNDRY_TEST_URL: ${{ secrets.FOUNDRY_TEST_URL }}
          FOUNDRY_TEST_USERNAME: ${{ secrets.FOUNDRY_TEST_USERNAME }}
          FOUNDRY_REST_URL: ${{ secrets.FOUNDRY_REST_URL }}
          FOUNDRY_REST_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_REST_TEST_CONTROL_URL }}
          FOUNDRY_JOURNAL_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_JOURNAL_TEST_CONTROL_URL }}
          FOUNDRY_ACTOR_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_ACTOR_TEST_CONTROL_URL }}
          FOUNDRY_SCENE_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_SCENE_TEST_CONTROL_URL }}
          FOUNDRY_DICE_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_DICE_TEST_CONTROL_URL }}
          FOUNDRY_ITEM_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_ITEM_TEST_CONTROL_URL }}
          FOUNDRY_REST_TEST_FIXTURES_JSON: ${{ secrets.FOUNDRY_REST_TEST_FIXTURES_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=false
          for required in FOUNDRY_TEST_URL FOUNDRY_TEST_USERNAME FOUNDRY_REST_URL FOUNDRY_REST_TEST_CONTROL_URL FOUNDRY_JOURNAL_TEST_CONTROL_URL FOUNDRY_ACTOR_TEST_CONTROL_URL FOUNDRY_SCENE_TEST_CONTROL_URL FOUNDRY_DICE_TEST_CONTROL_URL FOUNDRY_ITEM_TEST_CONTROL_URL FOUNDRY_REST_TEST_FIXTURES_JSON; do
            if [ -z "${!required}" ]; then
              echo "Missing live-test configuration: $required" >> "$GITHUB_STEP_SUMMARY"
              missing=true
            fi
          done
          if [ "$missing" = false ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "See the integration guide for the prepared disposable world, relay, controllers and scoped-key fixtures. FOUNDRY_TEST_PASSWORD may be empty." >> "$GITHUB_STEP_SUMMARY"
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::The prepared live-test endpoint is not configured."
              exit 1
            fi
          fi

  integration:
    name: Integration tests
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: foundryvtt-shared-test-world
      cancel-in-progress: false
    env:
      FOUNDRY_URL: ${{ secrets.FOUNDRY_TEST_URL }}
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_TEST_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_TEST_PASSWORD }}
      FOUNDRY_TEST_WORLD_ID: test1world
      FOUNDRY_REST_URL: ${{ secrets.FOUNDRY_REST_URL }}
      FOUNDRY_REST_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_REST_TEST_CONTROL_URL }}
      FOUNDRY_JOURNAL_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_JOURNAL_TEST_CONTROL_URL }}
      FOUNDRY_ACTOR_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_ACTOR_TEST_CONTROL_URL }}
      FOUNDRY_SCENE_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_SCENE_TEST_CONTROL_URL }}
      FOUNDRY_DICE_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_DICE_TEST_CONTROL_URL }}
      FOUNDRY_ITEM_TEST_CONTROL_URL: ${{ secrets.FOUNDRY_ITEM_TEST_CONTROL_URL }}
      FOUNDRY_REST_TEST_VERSION: 3.4.1
    steps:
      - name: Configure fixture path
        run: echo "FOUNDRY_REST_TEST_FIXTURES=$RUNNER_TEMP/foundry-rest-fixtures.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Write scoped-key fixtures
        env:
          FOUNDRY_REST_TEST_FIXTURES_JSON: ${{ secrets.FOUNDRY_REST_TEST_FIXTURES_JSON }}
        run: |
          bun -e 'import { writeFileSync } from "node:fs"; JSON.parse(process.env.FOUNDRY_REST_TEST_FIXTURES_JSON); writeFileSync(process.env.FOUNDRY_REST_TEST_FIXTURES, process.env.FOUNDRY_REST_TEST_FIXTURES_JSON, { mode: 0o600 });'
      - run: bun run build
      - run: bun run test:integration
      - name: Remove scoped-key fixtures
        if: always()
        run: rm -f -- "$FOUNDRY_REST_TEST_FIXTURES"
