name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.repository == 'laurigates/foundryvtt-mcp'
    # Pure GitHub-API job (no build) — 1-CPU slim runner is 3x cheaper.
    runs-on: ubuntu-slim
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ github.repository == 'laurigates/foundryvtt-mcp' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    # Review and update procedure: docs/adrs/0008-npm-trusted-publishing-oidc.md
    uses: laurigates/.github/.github/workflows/reusable-npm-publish.yml@aad403be1e3d72f68f6536f212ed3a0339263d22
    with:
      node-version: "24"
