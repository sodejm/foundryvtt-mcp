# Install as /etc/ssh/sshd_config.d/60-foundry-mcp.conf; validate with sshd -t.
Match User foundry-mcp
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/foundry-mcp.keys
    ForceCommand /usr/local/libexec/foundry-mcp-ssh
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    PermitTunnel no
    MaxSessions 1
Match all
